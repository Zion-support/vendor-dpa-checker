<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Vendor DPA Checker</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🔏 Vendor DPA Checker</h1><p>Paste DPA text to check for required clauses.</p><textarea id="d" rows="6" placeholder="Paste DPA excerpts..."></textarea><br><button onclick="go()">Check clauses</button><div id="out"></div><script>const req=[['subprocessor','Subprocessor list & notice'],['security','Security measures (TOMs)'],['breach','Breach notification timeline'],['audit','Audit rights'],['deletion|return','Data deletion/return on exit'],['scc|standard contractual','Transfer mechanism (SCCs)'],['dpia|impact assessment','DPIA support']];function go(){const d=document.getElementById('d').value.toLowerCase();let pass=0;const res=req.map(([k,l])=>{const ok=new RegExp(k).test(d);if(ok)pass++;return (ok?'✅':'❌ MISSING')+' '+l});document.getElementById('out').textContent=res.join('\n')+`\n\nDPA completeness: ${pass}/${req.length}\n${pass<req.length?'⚠️ Gaps found — request addendum from vendor.':'✅ Core clauses present.'}\n\nAutomated DPA pipeline for all vendors: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/vendor-dpa-checker">GitHub</a> · <a href="https://ziontechgroup.com/privacy-dsr-assistant/">DSR Assistant</a></p></body></html>
