<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Vendor DPA Checker</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📜 Vendor DPA Checker</h1><p>Paste DPA text to check required GDPR clauses.</p><textarea id="d" rows="6" placeholder="Paste DPA excerpt..."></textarea><br><button onclick="go()">Check</button><div id="out"></div><script>function go(){const d=document.getElementById('d').value.toLowerCase();const req={'Data subject rights':/data subject|right of access|erasure/,'Breach notification (72h)':/breach.*(72|seventy-two)|72.*hour/,'Subprocessor consent':/subprocessor|sub-processor/,'Audit rights':/audit/,'Deletion on termination':/delet|return.*data/,'SCCs / transfer mechanism':/standard contractual|scc|adequacy/,'Security measures (TOMs)':/technical and organi[sz]ational|encryption/};let res=[],miss=0;for(const[k,re]of Object.entries(req)){const ok=re.test(d);if(!ok)miss++;res.push((ok?'✅':'❌')+' '+k)}document.getElementById('out').textContent=res.join('\n')+`\n\nCoverage: ${7-miss}/7 clauses${miss?' — review before signing':''}\n\nFull DPA/SCC review workflow: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/vendor-dpa-checker">GitHub</a> · <a href="https://ziontechgroup.com/privacy-dsr-assistant/">DSR Assistant</a></p></body></html>
